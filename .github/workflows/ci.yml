name: Cloudflare CI

on:
  push:
    branches:
      - v1-web-cloudflare-ready
  pull_request:
    branches:
      - v1-web-cloudflare-ready

permissions:
  contents: read

jobs:
  verify:
    name: Full Cloudflare Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full verification
        run: npm run cf:verify
